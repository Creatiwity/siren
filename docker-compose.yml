networks:
  siren_network:
    external: false

services:
  siren:
    image: creatiwity/siren
    container_name: siren
    restart: unless-stopped
    user: "${DOCKER_UID}:${DOCKER_GID}"
    ports:
      - "3000:3000"
    environment:
      - RUST_LOG=${RUST_LOG}
      - API_KEY=${API_KEY}
      - SIRENE_ENV=${SIRENE_ENV}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - siren_network
  db:
    # PostGIS est indispensable (colonne `position`, recherche geographique) et
    # l'image embarque aussi les contrib utilises par la recherche : pg_trgm,
    # unaccent, fuzzystrmatch. Les extensions elles-memes sont creees par les
    # migrations Diesel au demarrage de l'API.
    #
    # PostgreSQL 17 au minimum : les migrations s'appuient sur des fonctions
    # schema-qualifiees pour survivre au search_path restreint que la 17
    # applique aux commandes de maintenance.
    image: postgis/postgis:17-3.5
    container_name: db
    restart: unless-stopped
    user: "${DOCKER_UID}:${DOCKER_GID}"
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - PGUSER=${POSTGRES_USER}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - ./docker/postgres:/var/lib/postgresql/data
      - /etc/passwd:/etc/passwd:ro
    networks:
      - siren_network
