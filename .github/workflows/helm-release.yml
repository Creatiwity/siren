name: Release Helm Chart

on:
  push:
    tags:
      - v*
    paths:
      - "app/**"
  # Publishes the current chart version, e.g. one released before the OCI push.
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Run chart-releaser
        uses: helm/chart-releaser-action@v1.6.0
        with:
          charts_dir: .
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"

      # Same chart, also as an OCI artifact: oci://ghcr.io/creatiwity/charts/siren.
      # A published version is never overwritten.
      - name: Push the chart to GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version=$(helm show chart app | awk '$1 == "version:" {print $2}')
          echo "$GH_TOKEN" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          if helm show chart oci://ghcr.io/creatiwity/charts/siren --version "$version" > /dev/null 2>&1; then
            echo "siren $version already on GHCR"
            exit 0
          fi
          helm package app --destination "$RUNNER_TEMP"
          helm push "$RUNNER_TEMP/siren-$version.tgz" oci://ghcr.io/creatiwity/charts
