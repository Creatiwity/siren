{{- if .Values.cronjob.enabled -}}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "app.fullname" . }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.cronSchedule | quote }}
  suspend: {{ .Values.cronjob.suspend }}
  {{- with .Values.cronjob }}
  {{- with .timeZone }}
  timeZone: {{ . | quote }}
  {{- end }}
  concurrencyPolicy: {{ .concurrencyPolicy }}
  {{- with .startingDeadlineSeconds }}
  startingDeadlineSeconds: {{ . }}
  {{- end }}
  successfulJobsHistoryLimit: {{ .successfulJobsHistoryLimit }}
  failedJobsHistoryLimit: {{ .failedJobsHistoryLimit }}
  {{- end }}
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            {{- include "app.jobPodLabels" (dict "root" . "component" "update") | nindent 12 }}
        spec:
          serviceAccountName: {{ include "app.serviceAccountName" . }}
          {{- include "app.podCommon" (dict "root" . "jobs" true "geocoding" true) | nindent 10 }}
          restartPolicy: OnFailure
          containers:
            - name: "{{ include "app.fullname" . }}-job-updater"
              securityContext:
                {{- toYaml .Values.securityContext | nindent 16 }}
              image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              {{- include "app.envFrom" . | nindent 14 }}
              env:
                {{- include "app.databaseEnv" (dict "root" .) | nindent 16 }}
                {{- include "app.skipMigrationsEnv" . | nindent 16 }}
                {{- include "app.secretEnv" (dict "root" . "env" "INSEE_CREDENTIALS" "key" "inseeCredentials") | nindent 16 }}
                {{- include "app.geocodingEnv" . | nindent 16 }}
                {{- include "app.commonEnv" (dict "root" .) | nindent 16 }}
              # With geocoding enabled, `update all` refreshes the index too
              # (geocoding.withUpdateAll).
              args: ["update", "all", "--crontab", {{ .Values.cronSchedule | quote }}]
              {{- with .Values.updateResources }}
              resources:
                {{- toYaml . | nindent 16 }}
              {{- end }}
              {{- if .Values.geocoding.enabled }}
              volumeMounts:
                {{- include "app.geocodingVolumeMount" . | nindent 16 }}
              {{- end }}
          {{- if .Values.geocoding.enabled }}
          volumes:
            {{- include "app.geocodingVolume" . | nindent 12 }}
          {{- end }}
{{- end }}
