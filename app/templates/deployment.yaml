apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "app.fullname" . }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "app.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "app.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "app.serviceAccountName" . }}
      # Must exceed shutdownDelaySeconds plus the longest request to drain.
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            {{- include "app.apiDatabaseEnv" . | nindent 12 }}
            - name: "DATABASE_POOL_SIZE"
              value: "{{ .Values.pgPoolSize }}"
            {{- include "app.skipMigrationsEnv" . | nindent 12 }}
            - name: "RUST_LOG"
              value: {{ .Values.rustLog }}
            - name: "SIRENE_ENV"
              value: {{ .Values.sireneEnv }}
            - name: "BASE_URL"
              value: {{ .Values.baseUrl }}
            - name: "SENTRY_DSN"
              value: {{ .Values.sentryDsn }}
            - name: "TOKIO_WORKER_THREADS"
              value: "{{ .Values.tokioWorkerThreads }}"
            - name: "SHUTDOWN_DELAY_SECONDS"
              value: "{{ .Values.shutdownDelaySeconds }}"
            {{- include "app.geocodingEnv" . | nindent 12 }}
          {{- if .Values.geocoding.enabled }}
          # The index is only read here; the jobs rebuild it in place.
          volumeMounts:
            - name: geocoding
              mountPath: {{ dir .Values.geocoding.indexPath }}
              readOnly: true
          {{- end }}
          # Migrations (or their check, with migrations.enabled) run before the
          # listener opens: the startup probe holds back the liveness probe
          # until then, instead of killing a pod that is still migrating.
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            {{- toYaml .Values.probes.startup | nindent 12 }}
          # Process only, never the database: an outage must not restart every
          # pod at once.
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            {{- toYaml .Values.probes.liveness | nindent 12 }}
          # Process + database: a failure only takes the pod out of the Service.
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            {{- toYaml .Values.probes.readiness | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- if .Values.geocoding.enabled }}
      volumes:
        {{- include "app.geocodingVolume" . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if and .Values.geocoding.enabled .Values.geocoding.persistence.sameNode }}
      # ReadWriteOnce geocoding volume: every API pod on the node it is
      # attached to, including the new ones of a rolling update.
      {{- include "app.geocodingAffinity" . | nindent 6 }}
      {{- else }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
