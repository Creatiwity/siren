{{/* Sensitive values, only the keys that are set. The migration hook has its
     own copy (migration-job.yaml): on first install it runs before this one
     exists. */}}
{{- if not .Values.secrets.existingSecret -}}
{{- $data := include "app.secretData" (dict "root" . "keys" (list "databaseUrl" "apiDatabaseUrl" "databasePassword" "apiDatabasePassword" "apiKey" "inseeCredentials" "sentryDsn")) -}}
{{- if trim $data -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "app.fullname" . }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
type: Opaque
data:
  {{- $data | nindent 2 }}
{{- end }}
{{- end }}
