# Default values for app.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: creatiwity/siren
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# Options
rustLog: "sirene=info"
sireneEnv: "production"
pgHost:
pgPort:
pgPoolSize: 200
pgDatabase:
pgUsername:
pgPassword:
apiKey:
baseUrl:
inseeCredentials:
sentryDsn:
cronSchedule: "0 4 * * *"
tokioWorkerThreads: 10

# Database migrations, applied by a Job run as a pre-install/pre-upgrade hook.
# The API and the updater then start with SKIP_MIGRATIONS=true: they only check,
# read-only, that no migration is pending, so their database may be a read
# replica. Set enabled to false to go back to migrating on startup.
migrations:
  enabled: true
  backoffLimit: 1
  # Also pass a large enough `helm upgrade --timeout` (5m by default), which
  # bounds the wait on hooks.
  activeDeadlineSeconds: 1800
  resources: {}

# Optional connection for the API Deployment only, typically a read replica.
# Each empty field falls back to its pg* counterpart; the migration Job and the
# updater CronJob always use pg*. Requires migrations.enabled.
# - /admin endpoints that launch an update write to the database, so they fail
#   against a read replica: trigger updates through the CronJob.
# - Right after a migration, a lagging replica may still report it as pending:
#   the new pods then exit and are restarted until the replica catches up.
apiDatabase:
  host:
  port:
  database:
  username:
  password:

# On SIGTERM the pod keeps serving this long with /health/ready failing, so it
# leaves the Service endpoints before the listener closes.
shutdownDelaySeconds: 5
terminationGracePeriodSeconds: 30

probes:
  # Up to 5 minutes for pending migrations before liveness takes over.
  startup:
    periodSeconds: 5
    timeoutSeconds: 2
    failureThreshold: 60
  liveness:
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 3
  # timeoutSeconds stays above the 2 s database check timeout in the app, so a
  # slow database yields an explicit 503 rather than a probe timeout.
  readiness:
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 2
    successThreshold: 1

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: siren-api.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: siren-api-tls
  #    hosts:
  #      - siren-api.local

# Gateway API routing, as an alternative to the Ingress above. Never enable both
# for the same host while either carries a certificate annotation.
gateway:
  enabled: false
  # Annotations on the ListenerSet, e.g. cert-manager.io/cluster-issuer.
  annotations: {}
  # The Gateway this ListenerSet attaches to. Required when enabled.
  parentRef:
    name: ""
    # Defaults to the release namespace when empty.
    namespace: ""
  hosts:
    - host: siren-api.local
  # Pins the TLS secret per host. Defaults to "<fullname>-tls" when unset.
  tls: []
  #  - secretName: siren-api-tls
  #    hosts:
  #      - siren-api.local

# extAuth -- Puts the /v3 route behind an external authorization service, which
# resolves the caller's api key and injects its identity and tier. /scalar,
# /admin and the health check are on a separate route and stay open.
# The GatewayExtension named here is created by the chart that owns the auth
# service, not by this one.
extAuth:
  enabled: false
  extensionRef:
    name: ""
    # Defaults to the release namespace when empty.
    namespace: ""

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}
