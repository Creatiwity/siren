# Default values for app.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: creatiwity/siren
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# Options
rustLog: "sirene=info"
sireneEnv: "production"
pgHost:
pgPort:
pgPoolSize: 200
pgDatabase:
pgUsername:
pgPassword:
apiKey:
baseUrl:
inseeCredentials:
sentryDsn:
cronSchedule: "0 4 * * *"
tokioWorkerThreads: 10

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: siren-api.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: siren-api-tls
  #    hosts:
  #      - siren-api.local

# Gateway API routing, as an alternative to the Ingress above. Never enable both
# for the same host while either carries a certificate annotation.
gateway:
  enabled: false
  # Annotations on the ListenerSet, e.g. cert-manager.io/cluster-issuer.
  annotations: {}
  # The Gateway this ListenerSet attaches to. Required when enabled.
  parentRef:
    name: ""
    # Defaults to the release namespace when empty.
    namespace: ""
  hosts:
    - host: siren-api.local
  # Pins the TLS secret per host. Defaults to "<fullname>-tls" when unset.
  tls: []
  #  - secretName: siren-api-tls
  #    hosts:
  #      - siren-api.local

# extAuth -- Puts the /v3 route behind an external authorization service, which
# resolves the caller's api key and injects its identity and tier. /scalar,
# /admin and the health check are on a separate route and stay open.
# The GatewayExtension named here is created by the chart that owns the auth
# service, not by this one.
extAuth:
  enabled: false
  extensionRef:
    name: ""
    # Defaults to the release namespace when empty.
    namespace: ""

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}
