[package]
name = "sirene"
version = "6.8.0"
authors = ["Julien Blatecky <julien.blatecky@creatiwity.net>"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
# Address geocoding: index sync (`update geocoding`), `address` search filter
# and the /v3/adresses endpoints.
geocoding = ["dep:geocoder-core"]

[dependencies]
async-trait = "0.1"
base64 = "0.23"
axum = { version = "0.8", features = ["json"] }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.6", features = ["derive", "env"] }
custom_error = "1.9"
diesel = { version = "2.3", features = [
  "postgres",
  "chrono",
  "serde_json",
  "64-column-tables",
] }
diesel-async = { version = "0.9", features = ["postgres", "deadpool"] }
diesel_migrations = { version = "2.3", features = ["postgres"] }
dotenv = "0.15"
futures = "0.3"
geocoder-core = { version = "0.4", default-features = false, features = ["signed"], optional = true }
jemallocator = "0.5"
openssl-sys = { version = "0.9", features = ["vendored"] }
postgis_diesel = { version = "3.1", features = ["serde"] }
pq-sys = { version = "0.7", features = ["bundled"] }
reqwest = { version = "0.13", default-features = false, features = [
  "query",
  "json",
  "stream",
  "rustls",
] }
sentry = { version = "0.49", features = [
  "tracing",
  "logs",
  "tower-axum-matched-path",
  "panic",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.53", features = [
  "macros",
  "io-util",
  "fs",
  "rt-multi-thread",
  "signal",
  "time",
] }
tokio-util = { version = "0.7", features = ["compat"] }
tower = { version = "0.5" }
tower-http = { version = "0.7", features = [
  "cors",
  "trace",
  "compression-full",
] }
opentelemetry = { version = "0.32", features = ["trace"] }
opentelemetry_sdk = { version = "0.32", features = ["rt-tokio", "logs"] }
opentelemetry-appender-tracing = "0.32"
# `reqwest-blocking-client` is the HTTP client itself: `reqwest-rustls` only
# brings TLS, and without a client the exporter cannot be built. Blocking,
# since the batch processor exports from its own thread, outside Tokio.
opentelemetry-otlp = { version = "0.32", default-features = false, features = [
  "trace",
  "logs",
  "http-proto",
  "reqwest-blocking-client",
  "reqwest-rustls",
] }
tracing = "0.1"
tracing-opentelemetry = "0.33"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
utoipa = { version = "5.5", features = ["axum_extras", "chrono"] }
utoipa-axum = "0.2"
utoipa-scalar = { version = "0.3", features = ["axum"] }
zip = "8.6"

[profile.release]
incremental = false
lto = "thin"        # ThinLTO pour réduire la taille binaire sans sacrifier les perfs
codegen-units = 1   # Meilleure optimisation (mais compilation plus lente)


[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
